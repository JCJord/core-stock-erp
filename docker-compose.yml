services:
  postgres:
    image: postgres:16-alpine
    container_name: corestock-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corestock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: corestock-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/corestock?schema=public
      PORT: 3000
      JWT_SECRET: dev_super_secret_corestock_jwt_key
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres
    command: npm run start:dev

volumes:
  postgres_data:
